name: Bakalari Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nainstalovat závislosti
        run: pip install ics arrow requests python-dotenv PyYAML click

      - name: Vytvořit kalendář
        env:
          BAKALARI_URL: ${{ secrets.BAKALARI_URL }}
          BAKALARI_USERNAME: ${{ secrets.BAKALARI_USERNAME }}
          BAKALARI_PASSWORD: ${{ secrets.BAKALARI_PASSWORD }}
        run: |
          python cli.py "$BAKALARI_URL" "$BAKALARI_USERNAME" "$BAKALARI_PASSWORD"

      - name: Uložit kalendář
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
